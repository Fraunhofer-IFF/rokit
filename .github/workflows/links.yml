name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *" # monatlich

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme http --scheme https --exclude-path content/.trash "content/**/*.md"
          fail: true
